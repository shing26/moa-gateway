[project]
name = "moa-gateway"
version = "0.1.0"
description = "Multi-Agent dynamic router and state-machine gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "redis>=5.0",
  "httpx>=0.27",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "python-dotenv>=1.0",
  "litellm>=1.96.2",
  "uvicorn>=0.52.3",
  "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6", "bandit>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6", "bandit>=1.7"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["scripts"]

[tool.ruff.lint]
ignore = [
  "B008",
  "B018",
  "BLE001",
  "DTZ011",
  "E722",
  "EXE005",
  "F401",
  "F811",
  "F821",
  "F841",
  "FURB162",
  "I001",
  "PIE810",
  "PLW0602",
  "PYI034",
  "RUF012",
  "RUF015",
  "RUF022",
  "RUF100",
  "RUF059",
  "S110",
  "S112",
  "SIM102",
  "SIM103",
  "SIM114",
  "SIM115",
  "SIM117",
  "SIM118",
  "TRY002",
  "TRY401",
  "UP017",
  "UP035",
  "UP037",
]

[tool.bandit]
skips = ["B105", "B107", "B110", "B112", "B324"]
