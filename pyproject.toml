[project]
name = "moa-gateway"
version = "0.1.0"
description = "Multi-Agent dynamic router and state-machine gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "pydantic>=2.7",
  "redis>=5.0",
  "httpx>=0.27",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]
