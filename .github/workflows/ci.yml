name: CI

on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest tests/unit -v
      - name: Lint
        run: uv run ruff check .
      - name: Guard against source-patch scripts
        run: uv run python scripts/check_no_source_patch.py
      - name: Security scan
        run: uv run bandit -r app -q -s B105,B107,B110,B112,B324
      - name: Eval smoke
        run: uv run python evals/run_evals.py --offline
      - name: Redteam baseline
        # 零网络、约 1 秒。此前该脚本 exit code 恒为 0，README 的"100%"没有约束。
        # 用例与策略正则同源，所以 100% 是防漂移不变量，不是泛化能力证据。
        run: uv run python scripts/redteam/run_redteam.py
      - name: Verify imports
        run: uv run python -c "import app.main"

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
